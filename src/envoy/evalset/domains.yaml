# Domain samples: the same checks as the held-out set, on three knowledge bases
# that are not a shop. Each sample names its domain; the eval seeds that
# domain's glossary and knowledge into a fresh store before composing.
# Everything here is invented: no real clinic, bank, university or person.
# Written on 2026-09-27, after the prompts were fixed; never used to tune them.
domains:
  clinic:
    name: Riverside Family Clinic
    glossary:
      - [Riverside Family Clinic, "", "*", true, "Clinic name; never translate."]
      - [CarePortal, "", "*", true, "Patient portal name; never translate."]
    knowledge:
      - [Appointments, "Appointments can be cancelled or rescheduled up to 24 hours before the visit through CarePortal or by phone. A missed appointment without notice is charged a $40 fee.\n\nSame-day appointments for today are offered when you call before 10:00 in the morning."]
      - [Opening hours, "The clinic is open Monday to Friday from 8:00 to 17:00 and on Saturday from 9:00 to 13:00. It is closed on Sunday."]
      - [Test results, "Lab and blood test results are posted to CarePortal within 3 to 5 business days. Results are not sent by email; a nurse calls if anything needs attention, and what a result means is explained by your doctor at a visit or a video visit, not by message.\n\nFor a fasting blood test, do not eat for 12 hours before the appointment; water is allowed."]
      - [Prescriptions, "Prescription refills are requested through CarePortal or by phone and are ready within 2 business days. Controlled medications cannot be refilled by message and require an appointment with your doctor."]
      - [Video visits, "Video visits last 20 minutes. The link is sent by text message 15 minutes before the visit."]
      - [Medical records, "Copies of medical records are provided within 10 business days of a signed request form, which is available at reception and on CarePortal."]
      - [Billing, "The copay is due at the visit. A balance above $200 can be paid in instalments through a payment plan arranged with the billing office at extension 3."]
      - [Urgent symptoms, "For urgent symptoms such as chest pain, difficulty breathing or a severe allergic reaction, call 911 or go to the nearest emergency department. Messages to the clinic are read during opening hours only and are not for emergencies."]
  bank:
    name: Harbor Bank
    glossary:
      - [Harbor Bank, "", "*", true, "Bank name; never translate."]
    knowledge:
      - [Lost or stolen cards, "A lost or stolen card is blocked the moment you report it. A replacement card arrives within 5 business days. The card emergency line 0800 700 200 is open 24 hours a day."]
      - [Transfers, "Domestic transfers ordered before 15:00 on a business day arrive the same day; later ones arrive the next business day.\n\nInternational transfers take 2 to 4 business days and cost a flat fee of $25."]
      - [Disputed transactions, "A card transaction can be disputed within 60 days of the statement date. A provisional credit is posted within 10 business days while the dispute is investigated."]
      - [Account fees and interest, "The monthly account fee is $6 and is waived in any month where the balance stays above $1,500. Overdraft interest is 13% per year."]
      - [Branch and online hours, "Branches are open Monday to Friday from 9:00 to 16:00. The app and online banking are available 24 hours a day."]
      - [Security and your PIN, "Harbor Bank never asks for your PIN, your full password or a one-time code by email, text message or phone. Report such a request through the app."]
  university:
    name: Northgate University
    glossary:
      - [Northgate University, "", "*", true, "University name; never translate."]
    knowledge:
      - [Application deadlines, "Applications for the autumn intake close on 15 January and for the spring intake on 1 September. Admission decisions are sent within 6 weeks of the deadline."]
      - [Required documents, "An application needs transcripts, two reference letters and an English test: IELTS 7 overall or TOEFL 90. Documents not in English must come with a certified translation."]
      - [Fees and deposit, "The application fee is $75. Admitted students pay a tuition deposit of $500 within 30 days of the offer. The deposit is refunded only if a student visa is refused."]
      - [Scholarships, "Merit scholarships cover up to 40% of tuition. The scholarship application is separate and closes on 1 March."]
      - [Housing, "Applications for on-campus housing open on 1 April. Housing is guaranteed for first-year students who apply by 1 June."]
      - [Visa letters, "The admission letter needed for a student visa is issued within 10 business days of the deposit being received."]

samples:
  # ---- clinic --------------------------------------------------------------

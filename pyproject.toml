[project]
name = "envoy-ai"
version = "0.11.1"
description = "Reply to anyone in their language, and sound like a local. Private, local, multilingual reply assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "mcp>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "playwright>=1.45", "pytest-playwright>=0.5"]
pdf = ["pypdf>=4"]  # envoy import of PDF documents

[project.scripts]
envoy = "envoy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
envoy = ["prompts/*.md", "locales/*.yaml", "evalset/*.yaml", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

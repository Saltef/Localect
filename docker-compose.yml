# Localect behind Caddy with automatic HTTPS. Set LOCALECT_DOMAIN and LOCALECT_OWNER_PASSWORD
# in a .env file next to this compose file, then: docker compose up -d
services:
  localect:
    build: .
    restart: unless-stopped
    environment:
      LOCALECT_HOST: 0.0.0.0
      LOCALECT_PORT: 8765
      LOCALECT_DATA_DIR: /data
      LOCALECT_TRUST_PROXY: "1"
      LOCALECT_OWNER_PASSWORD: ${LOCALECT_OWNER_PASSWORD:?set LOCALECT_OWNER_PASSWORD in .env}
      LOCALECT_PUBLIC_MODE: ${LOCALECT_PUBLIC_MODE:-off}      # off | demo
      LOCALECT_PUBLIC_MODEL: ${LOCALECT_PUBLIC_MODEL:-stub}   # stub | configured
      LOCALECT_PUBLIC_HOURLY: ${LOCALECT_PUBLIC_HOURLY:-20}
      LOCALECT_PUBLIC_DAILY: ${LOCALECT_PUBLIC_DAILY:-300}
      LOCALECT_PROVIDER: ${LOCALECT_PROVIDER:-stub}           # cohere | openai | stub
      LOCALECT_MODEL: ${LOCALECT_MODEL:-command-a-03-2025}
      LOCALECT_API_KEY: ${LOCALECT_API_KEY:-}
      LOCALECT_ENDPOINT: ${LOCALECT_ENDPOINT:-http://host.docker.internal:11434/v1}
    volumes:
      - localect-data:/data
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LOCALECT_DOMAIN: ${LOCALECT_DOMAIN:?set LOCALECT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - localect

volumes:
  localect-data:
  caddy-data:
  caddy-config:
